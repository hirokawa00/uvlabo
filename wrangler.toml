name = "uvlabo"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静的ファイル（画像・CSS・JS）の配信設定
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ── 環境変数 ──────────────────────────────────────────────────────
[vars]
NEXT_PUBLIC_BASE_URL = "https://uvlabo.jp"

